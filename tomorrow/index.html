<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomorrow | Andy Tran</title>
  <meta name="description" content="Tomorrow — a short text game about one day, regret, and letting go." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="term" aria-label="Tomorrow, a text game">
    <div id="out" role="log" aria-live="polite"></div>
    <form id="line" autocomplete="off">
      <label for="cmd" class="prompt">&gt;</label>
      <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
        enterkeyhint="send" aria-label="Type what you want to do" />
    </form>
  </main>
  <script src="game.js"></script>
</body>
</html>
